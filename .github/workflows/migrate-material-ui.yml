# One-off: migrate from the deprecated in-SDK Material library to the
# standalone material_ui package (Flutter 3.47+), using the official dart fix.
# Removed in the commit that follows its run.
name: Migrate to material_ui (one-off)

on:
  push:
    branches: [phase/f1-foundation]
    paths: [".github/workflows/migrate-material-ui.yml"]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/f1-foundation
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub add material_ui cupertino_ui
      - run: flutter pub get
      - run: dart fix --apply --code=migrate_design_widgets
      - name: Resolve localisation imports (Material delegates now ship in material_ui)
        shell: bash
        run: |
          for f in lib/app.dart test/helpers.dart; do
            python3 - "$f" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          old = "import 'package:flutter_localizations/flutter_localizations.dart';"
          new = ("import 'package:cupertino_ui/cupertino_ui.dart'\n"
                 "    show GlobalCupertinoLocalizations;\n"
                 "import 'package:flutter_localizations/flutter_localizations.dart'\n"
                 "    show GlobalWidgetsLocalizations;")
          assert old in s, p
          open(p, "w", encoding="utf-8").write(s.replace(old, new))
          PY
          done
          head -12 lib/app.dart
      - run: dart fix --dry-run || true
      - run: dart format $(find lib test -name '*.dart' ! -name '*.g.dart')
      - run: flutter analyze --no-fatal-infos || true
      - run: flutter test
      - name: Show diff
        run: git --no-pager diff --stat && git --no-pager diff -- pubspec.yaml lib/app.dart test/helpers.dart
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "refactor(mobile): migrate to standalone material_ui package (dart fix migrate_design_widgets)"
          git push
