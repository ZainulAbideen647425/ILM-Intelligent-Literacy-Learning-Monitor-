name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: write  # lets the format step push a style commit on feature branches

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tokens:
    name: Design tokens in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/gen_tokens.py --check

  mobile:
    name: Mobile · format, analyze, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get

      - name: Format (auto-fix on feature branches, enforce on main and PRs)
        shell: bash
        run: |
          files=$(find lib test -name '*.dart' ! -name '*.g.dart')
          if dart format --output=none --set-exit-if-changed $files; then
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            dart format $files
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "style: apply dart format"
            git push
          else
            echo "::error::Code is not formatted. Run: dart format lib test"
            exit 1
          fi

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Unit and widget tests
        run: flutter test --coverage --reporter expanded

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f coverage/lcov.info ]; then
            hit=$(grep -h '^LH:' coverage/lcov.info | cut -d: -f2 | paste -sd+ | bc)
            found=$(grep -h '^LF:' coverage/lcov.info | cut -d: -f2 | paste -sd+ | bc)
            pct=$(awk "BEGIN { printf \"%.1f\", 100 * $hit / $found }")
            echo "Line coverage: $pct% ($hit/$found)"
            echo "### Mobile line coverage: $pct% ($hit/$found lines)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-coverage
          path: mobile/coverage/lcov.info
          if-no-files-found: ignore

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
